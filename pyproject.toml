[project]
name = "rl-gan-inpainting"
version = "0.1.0"
description = "Adaptive Image Inpainting using Reinforcement Learning Guided GAN (RL-GAN)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0+cpu",
    "torchvision==0.23.0+cpu",
    "stable-baselines3>=2.2.0",
    "gymnasium>=0.29.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scikit-image>=0.21.0",
    "lpips>=0.1.4",
    "pytorch-fid>=0.3.0",
    "tensorboard>=2.15.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "pytest>=7.4.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
