# RL Contextual Bandit — DeepFill-v2 backbone + pretrained adapters (Experiment B)
data:
  image_dir: "data/raw/val2017"      # COCO val2017 (5k images, 1 GB)
  mask_dir: null
  image_size: 256
  synthetic_size: null               # Use real COCO images only

model:
  cnum: 48                           # Must match nipponjo checkpoint
  strategy_dim: 64
  latent_dim: 256
  backbone_checkpoint: "checkpoints/pretrained/deepfillv2_places2.pth"
  adapters_checkpoint: "checkpoints/adapters/adapters_final.pt"
  disc_base_channels: 64            # SN-PatchGAN discriminator

rl:
  total_timesteps: 10000             # Smoke test. Scale to 50000 for full run.
  n_steps: 128
  batch_size: 32
  n_epochs: 4
  learning_rate: 0.0003
  gamma: 0.0                        # 0.0 = contextual bandit (1-step episode)
  ent_coef: 0.05                    # Increased from 0.01 to encourage exploration
  vf_coef: 0.5
  max_grad_norm: 0.5
  reward_weights: [1.0, 1.0, 0.5, 0.3, 0.1]  # (dPSNR, dSSIM, dLPIPS, dDisc, cost)
  compute_lpips: true               # Feasible now that backbone is frozen
  device: "cuda"
  seed: 42
  save_dir: "checkpoints/rl_agent_bandit"
  log_dir: "logs/rl_agent_bandit"
